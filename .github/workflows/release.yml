env:
  DIRECTORY: dist
  PROJECT_NAME: refined-prun

name: Release
on:
  workflow_dispatch: null
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:

  build:
    name: Build
    outputs:
      created: ${{ env.DAILY_VERSION_CREATED }}
      revision: ${{ steps.publish.outputs.revision }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare release notes
        if: github.ref_type == 'branch'
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            exit 0
          fi
          DAILY_VERSION=$(npx --yes daily-version@2)
          node scripts/finalize-changelog.mjs "$DAILY_VERSION"
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          echo "DAILY_VERSION=$DAILY_VERSION" >> "$GITHUB_ENV"
          echo "DAILY_VERSION_CREATED=yes" >> "$GITHUB_ENV"
      - name: Build
        if: env.DAILY_VERSION_CREATED
        run: pnpm build
      - name: Update manifest.json with version ${{ env.DAILY_VERSION }}
        if: env.DAILY_VERSION_CREATED
        run: npx dot-json@1 "$DIRECTORY/manifest.json" version "$DAILY_VERSION"
      - name: Commit release notes and create tag
        id: publish
        if: env.DAILY_VERSION_CREATED
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "Release $DAILY_VERSION"
          git tag -a "$DAILY_VERSION" -m "$DAILY_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$DAILY_VERSION"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Ready for "submit" jobs
        if: env.DAILY_VERSION_CREATED
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.DIRECTORY }}
      - name: Create release
        if: env.DAILY_VERSION_CREATED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.DIRECTORY }}
        run: |
          FILENAME="$PROJECT_NAME-$DAILY_VERSION-for-local-testing-only.zip"
          zip -r "$FILENAME" ./*
          # Create as draft to curate it before sending it out
          gh release create "$DAILY_VERSION" "$FILENAME" --notes "Refer to [CHANGELOG.md](https://github.com/refined-prun/refined-prun/blob/main/CHANGELOG.md) for details."

  chrome:
    if: needs.build.outputs.created
    needs: build
    name: Submit (Chrome)
    environment: Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - uses: actions/download-artifact@v4
      - run: npx chrome-webstore-upload-cli@3
        working-directory: artifact
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

  firefox:
    if: needs.build.outputs.created
    needs: build
    name: Submit (Firefox)
    environment: Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
          ref: ${{ needs.build.outputs.revision }}
      - name: Zip source code
        run: git archive --output source.zip HEAD

      - uses: actions/download-artifact@v4
      - name: Upload build and source code
        run: npx web-ext@8 sign --channel listed --upload-source-code ../source.zip
        working-directory: artifact
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
